services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-development-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-template_app}
      POSTGRES_USER: ${POSTGRES_USER:-template_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template_app}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_app}
      POSTGRES_USER: ${POSTGRES_USER:-template_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-template_app} -d ${POSTGRES_DB:-template_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
