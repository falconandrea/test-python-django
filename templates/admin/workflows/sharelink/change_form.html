{% extends "admin/change_form.html" %}

{% block after_field_sets %}
  {{ block.super }}
  {% if full_public_url %}
    <fieldset class="module aligned">
      <h2>Link da condividere</h2>
      <div class="form-row">
        <div>
          <label for="full-public-url">URL pubblico</label>
          <input id="full-public-url" type="url" value="{{ full_public_url }}" readonly onclick="this.select()" style="width: min(760px, 100%);">
          <p class="help">Clicca il campo per selezionare il link completo e copiarlo.</p>
        </div>
      </div>
    </fieldset>
  {% endif %}
{% endblock %}
