{% load static %}
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Compilazione{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'workflows/app.css' %}">
</head>
<body>
  <main class="page-shell">
    {% if messages %}
      <div class="messages" aria-live="polite">
        {% for message in messages %}<div class="notice notice-{{ message.tags }}">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
